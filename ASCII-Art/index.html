<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur Image vers ASCII Art Pro</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-color);
    }

    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .controls-panel {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .drop-zone {
      border: 2px dashed var(--accent-color);
      border-radius: 6px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .drop-zone:hover, .drop-zone.dragover {
      background-color: rgba(56, 189, 248, 0.1);
    }

    .drop-zone input[type="file"] {
      display: none;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
    }

    .radio-group {
      display: flex;
      gap: 1rem;
    }

    .radio-group label {
      color: var(--text-color);
      font-weight: normal;
      cursor: pointer;
    }

    select {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem;
      border-radius: 4px;
      font-family: inherit;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .preview-panel {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      max-height: 80vh;
    }

    #ascii-display {
      font-family: "Courier New", Courier, monospace;
      font-size: 8px;
      line-height: 8px;
      letter-spacing: 0px;
      white-space: pre;
      background-color: #000;
      padding: 1rem;
      border-radius: 4px;
      display: inline-block;
      user-select: all;
    }
  </style>
</head>
<body>

  <header>
    <h1>Convertisseur Image vers ASCII Art Pro</h1>
  </header>

  <main>
    <section class="controls-panel">
      <!-- Zone d'import de fichier -->
      <div class="drop-zone" id="drop-zone">
        <p>Glissez une photo ici ou <strong>cliquez</strong> pour sélectionner</p>
        <input type="file" id="file-input" accept="image/*">
      </div>

      <!-- Mode de rendu (Couleur vs N&B) -->
      <div class="control-group">
        <label>Mode d'affichage</label>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="bw" checked> Noir & Blanc</label>
          <label><input type="radio" name="mode" value="color"> Couleur</label>
        </div>
      </div>

      <!-- Ajustement de la largeur -->
      <div class="control-group">
        <label for="width-slider">Résolution (Largeur) : <span id="width-val">100</span> car.</label>
        <input type="range" id="width-slider" min="30" max="250" value="100">
      </div>

      <!-- Inversion de luminance -->
      <div class="control-group">
        <label><input type="checkbox" id="invert-check"> Inverser les couleurs (Fond blanc)</label>
      </div>

      <!-- Palette ASCII choisie -->
      <div class="control-group">
        <label for="palette-select">Jeu de caractères</label>
        <select id="palette-select">
          <option value="alphaFull">Alphabet complet A-Z / a-z (Trié par densité)</option>
          <option value="alphaUpper">Alphabet Majuscules uniquement (A-Z)</option>
          <option value="dense">Étendue Maximale (Lettres, Chiffres & Symboles)</option>
          <option value="standard">Standard (@%#*+=-:. )</option>
          <option value="blocks">Blocs (█▓▒░ )</option>
        </select>
      </div>

      <button id="copy-btn">Copier l'ASCII (avec couleurs)</button>
    </section>

    <!-- Visualiseur ASCII -->
    <section class="preview-panel">
      <pre id="ascii-display">Veuillez charger une image pour commencer.</pre>
    </section>
  </main>

  <script>
    // Jeux de caractères triés par densité visuelle
    const PALETTES = {
      alphaFull: "MWB8&$Q0KH%R#EDPXGZXSaokbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ",
      alphaUpper: "MWB8Q0KHREDPXGZXSAOKBDPQWMZOQLCJUYXI ",
      dense: "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ",
      standard: "@%#*+=-:. ",
      blocks: "█▓▒░ "
    };

    // Éléments du DOM
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const widthSlider = document.getElementById('width-slider');
    const widthVal = document.getElementById('width-val');
    const invertCheck = document.getElementById('invert-check');
    const paletteSelect = document.getElementById('palette-select');
    const asciiDisplay = document.getElementById('ascii-display');
    const copyBtn = document.getElementById('copy-btn');

    let currentImage = null;

    // Gestion de l'import d'image
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Écouteurs d'événements
    widthSlider.addEventListener('input', (e) => {
      widthVal.textContent = e.target.value;
      render();
    });
    document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', render));
    invertCheck.addEventListener('change', render);
    paletteSelect.addEventListener('change', render);

    // Moteur de rendu ASCII
    function render() {
      if (!currentImage) return;

      const targetWidth = parseInt(widthSlider.value, 10);
      const isColor = document.querySelector('input[name="mode"]:checked').value === 'color';
      const isInverted = invertCheck.checked;
      const chars = PALETTES[paletteSelect.value];
      const numChars = chars.length;

      const FONT_ASPECT_RATIO = 0.455; 
      const imageAspectRatio = currentImage.height / currentImage.width;
      const targetHeight = Math.round(targetWidth * imageAspectRatio * FONT_ASPECT_RATIO);

      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(currentImage, 0, 0, targetWidth, targetHeight);

      const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
      const data = imageData.data;

      let htmlResult = '';

      asciiDisplay.style.backgroundColor = isInverted ? '#ffffff' : '#000000';
      asciiDisplay.style.color = isInverted ? '#000000' : '#ffffff';

      for (let y = 0; y < targetHeight; y++) {
        for (let x = 0; x < targetWidth; x++) {
          const idx = (y * targetWidth + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          let brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          if (isInverted) brightness = 1 - brightness;

          const charIndex = Math.floor(brightness * (numChars - 1));
          const rawChar = chars[charIndex];
          const char = rawChar === ' ' ? '&nbsp;' : escapeHtml(rawChar);

          if (isColor) {
            htmlResult += `<span style="color: rgb(${r},${g},${b})">${char}</span>`;
          } else {
            htmlResult += char;
          }
        }
        htmlResult += '\n';
      }

      asciiDisplay.innerHTML = htmlResult;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Copie intelligente enrichie (HTML + Texte Brut)
    copyBtn.addEventListener('click', async () => {
      if (!currentImage) return;

      const isColor = document.querySelector('input[name="mode"]:checked').value === 'color';
      const isInverted = invertCheck.checked;
      const bgColor = isInverted ? '#ffffff' : '#000000';
      const textColor = isInverted ? '#000000' : '#ffffff';

      // 1. Version Texte brut
      const plainText = asciiDisplay.innerText;

      // 2. Version HTML riche avec styles en ligne explicites pour Word/RichText
      const htmlFormatted = `
        <div style="font-family: 'Courier New', Courier, monospace; font-size: 8px; line-height: 8px; background-color: ${bgColor}; color: ${textColor}; white-space: pre; padding: 10px;">
          ${asciiDisplay.innerHTML}
        </div>
      `;

      try {
        if (isColor && window.ClipboardItem) {
          // Injection HTML pour conserver les couleurs au collage dans Word / Docs / Mail
          const blobHtml = new Blob([htmlFormatted], { type: 'text/html' });
          const blobText = new Blob([plainText], { type: 'text/plain' });

          const clipboardItem = new ClipboardItem({
            'text/html': blobHtml,
            'text/plain': blobText
          });

          await navigator.clipboard.write([clipboardItem]);
        } else {
          // Repli classique texte brut
          await navigator.clipboard.writeText(plainText);
        }

        const prevText = copyBtn.innerText;
        copyBtn.innerText = "Copié avec succès !";
        setTimeout(() => copyBtn.innerText = prevText, 2000);
      } catch (err) {
        console.error("Erreur lors de la copie :", err);
        // Fallback en cas de refus d'autorisation navigateur
        navigator.clipboard.writeText(plainText);
        copyBtn.innerText = "Copié (Texte brut)";
        setTimeout(() => copyBtn.innerText = "Copier l'ASCII (avec couleurs)", 2000);
      }
    });
  </script>
</body>
</html>
