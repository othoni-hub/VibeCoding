<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecha-Kucha Timer SPA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 overflow-hidden flex flex-col">

    <!-- ÉCRAN D'ACCUEIL / UPLOAD -->
    <div id="upload-screen" class="flex-1 flex flex-col items-center justify-center p-6 transition-all duration-300">
        <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center">
            <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl">
                <i class="fa-solid fa-file-pdf"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Pecha-Kucha Player</h1>
            <p class="text-slate-400 text-sm mb-8">Glissez votre diaporama PDF ou sélectionnez-le pour lancer la projection minutée.</p>
            
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-8 cursor-pointer bg-slate-950/50 hover:bg-slate-900/50 transition-all group">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-500 group-hover:text-indigo-400 mb-3 transition-colors"></i>
                <span class="text-sm font-medium text-slate-300">Sélectionner un fichier PDF</span>
                <span class="text-xs text-slate-500 mt-1">Format PDF accepté</span>
                <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden">
            </label>

            <!-- Paramètres initiaux rapides -->
            <div class="grid grid-cols-2 gap-4 mt-6 text-left">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Secondes par diapo</label>
                    <input type="number" id="setting-seconds" value="20" min="5" max="300" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Mode auto-play</label>
                    <select id="setting-autoplay" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="true">Actif</option>
                        <option value="false">Manuel</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- ÉCRAN DE PRÉSENTATION -->
    <div id="presentation-screen" class="hidden flex-1 relative flex flex-col items-center justify-center bg-black overflow-hidden p-0 m-0">
        
        <!-- Canvas pour afficher le PDF (Zone de projection maximisée) -->
        <div class="relative w-full h-full flex items-center justify-center p-1">
            <canvas id="pdf-canvas" class="max-h-[96vh] max-w-[98vw] object-contain shadow-2xl rounded-sm transition-opacity opacity-100"></canvas>
        </div>

        <!-- TIMER EN HAUT À DROITE -->
        <div class="absolute top-4 right-4 z-30 flex items-center gap-3 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-4 py-2 rounded-2xl shadow-xl">
            <div class="relative w-10 h-10 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="3" class="text-slate-800 fill-none"/>
                    <circle id="timer-progress" cx="20" cy="20" r="16" stroke="currentColor" stroke-width="3" class="text-indigo-500 fill-none transition-all duration-1000" stroke-dasharray="100.5" stroke-dashoffset="0"/>
                </svg>
                <span id="timer-text" class="absolute text-xs font-bold">20</span>
            </div>
            <div class="flex flex-col">
                <span id="slide-counter" class="text-xs font-semibold text-slate-300">Diapo 1 / 20</span>
                <span id="timer-status" class="text-[10px] text-slate-400">En cours</span>
            </div>
        </div>

        <!-- MENU DE PARAMÉTRAGE ESCAMOTABLE (Bouton + Panneau) -->
        <button id="toggle-settings" class="absolute top-4 left-4 z-30 bg-slate-900/80 hover:bg-slate-800 backdrop-blur-md border border-slate-700/50 text-slate-300 w-10 h-10 rounded-xl flex items-center justify-center shadow-xl transition-all">
            <i class="fa-solid fa-gear"></i>
        </button>

        <!-- Panneau escamotable -->
        <div id="settings-panel" class="absolute top-16 left-4 z-30 w-72 bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 shadow-2xl transform -translate-x-96 opacity-0 transition-all duration-300">
            <h3 class="text-sm font-semibold mb-4 flex items-center justify-between">
                <span>Paramètres de session</span>
                <button id="close-settings" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </h3>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-400 mb-1">Durée par diapositive (sec)</label>
                    <input type="number" id="panel-seconds" value="20" min="5" max="300" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <div class="flex justify-between font-medium text-slate-400 mb-1">
                        <label for="panel-transition-speed">Vitesse de transition</label>
                        <span id="transition-speed-label" class="text-indigo-400">Moyen</span>
                    </div>
                    <input type="range" id="panel-transition-speed" min="1" max="4" value="2" class="w-full accent-indigo-500 cursor-pointer">
                    <div class="flex justify-between text-[10px] text-slate-500 mt-1">
                        <span>Rapide</span>
                        <span>Moyen</span>
                        <span>Lent</span>
                        <span>Très lent</span>
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-slate-400 mb-1">Mode plein écran</label>
                    <button id="btn-fullscreen" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-expand mr-2"></i> Basculer Plein Écran
                    </button>
                </div>
                <hr class="border-slate-800">
                <button id="btn-quit" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 py-2 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Quitter la présentation
                </button>
            </div>
        </div>

        <!-- BARRE DE CONTRÔLE INFÉRIEURE -->
        <div class="absolute bottom-4 z-30 flex items-center gap-4 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-5 py-2.5 rounded-2xl shadow-xl">
            <button id="btn-prev" class="text-slate-400 hover:text-white transition-colors p-2" title="Diapo précédente"><i class="fa-solid fa-backward-step"></i></button>
            <button id="btn-play-pause" class="w-9 h-9 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center shadow-lg transition-all" title="Pause / Lecture"><i class="fa-solid fa-pause"></i></button>
            <button id="btn-next" class="text-slate-400 hover:text-white transition-colors p-2" title="Diapo suivante"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        let pdfDoc = null;
        let pageNum = 1;
        let totalPages = 0;
        let secondsPerSlide = 20;
        let timeLeft = 20;
        let isPlaying = false;
        let timerInterval = null;
        let transitionDuration = 400; // valeur par défaut (ms)
        
        const transitionSpeeds = {
            1: { duration: 150, label: "Rapide" },
            2: { duration: 400, label: "Moyen" },
            3: { duration: 800, label: "Lent" },
            4: { duration: 1200, label: "Très lent" }
        };

        let canvas = document.getElementById('pdf-canvas');
        let ctx = canvas.getContext('2d');

        // DOM Elements
        const uploadScreen = document.getElementById('upload-screen');
        const presentationScreen = document.getElementById('presentation-screen');
        const pdfFileInput = document.getElementById('pdf-file-input');
        const timerText = document.getElementById('timer-text');
        const timerProgress = document.getElementById('timer-progress');
        const slideCounter = document.getElementById('slide-counter');
        const timerStatus = document.getElementById('timer-status');
        const playPauseBtn = document.getElementById('btn-play-pause');
        const settingsPanel = document.getElementById('settings-panel');
        const transitionSpeedInput = document.getElementById('panel-transition-speed');
        const transitionSpeedLabel = document.getElementById('transition-speed-label');

        function updateTransitionSpeed(level) {
            const config = transitionSpeeds[level];
            transitionDuration = config.duration;
            transitionSpeedLabel.textContent = config.label;
            canvas.style.transitionDuration = `${transitionDuration}ms`;
        }

        updateTransitionSpeed(transitionSpeedInput.value);

        transitionSpeedInput.addEventListener('input', (e) => {
            updateTransitionSpeed(e.target.value);
        });

        // Gestionnaire d'upload
        pdfFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                secondsPerSlide = parseInt(document.getElementById('setting-seconds').value) || 20;
                const fileReader = new FileReader();
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    try {
                        pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                        totalPages = pdfDoc.numPages;
                        pageNum = 1;
                        
                        // Transition vers l'écran de présentation
                        uploadScreen.classList.add('hidden');
                        presentationScreen.classList.remove('hidden');
                        
                        renderPage(pageNum);
                        startTimer();
                    } catch (error) {
                        alert("Erreur lors du chargement du PDF.");
                        console.error(error);
                    }
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        // Rendu de la page PDF sur le canvas avec fondu enchaîné à vitesse variable
        async function renderPage(num) {
            // Fondu de sortie (Fade Out)
            canvas.classList.remove('opacity-100');
            canvas.classList.add('opacity-0');

            setTimeout(async () => {
                const page = await pdfDoc.getPage(num);
                // Augmentation de l'échelle pour un rendu haute définition sur grand écran
                const viewport = page.getViewport({ scale: 2.0 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                await page.render(renderContext).promise;
                slideCounter.textContent = `Diapo ${num} / ${totalPages}`;

                // Fondu d'entrée (Fade In)
                canvas.classList.remove('opacity-0');
                canvas.classList.add('opacity-100');
            }, transitionDuration);
        }

        // Gestion du Timer
        const circumference = 2 * Math.PI * 16; // r=16
        timerProgress.style.strokeDasharray = circumference;

        function startTimer() {
            isPlaying = true;
            timeLeft = secondsPerSlide;
            updateTimerDisplay();
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            timerStatus.textContent = "En cours";

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    nextSlide();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerText.textContent = timeLeft;
            const offset = circumference - (timeLeft / secondsPerSlide) * circumference;
            timerProgress.style.strokeDashoffset = offset;
        }

        function pauseTimer() {
            isPlaying = false;
            clearInterval(timerInterval);
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            timerStatus.textContent = "En pause";
        }

        function nextSlide() {
            if (pageNum < totalPages) {
                pageNum++;
                renderPage(pageNum);
                timeLeft = secondsPerSlide;
            } else {
                pauseTimer();
                timerStatus.textContent = "Terminé !";
            }
        }

        function prevSlide() {
            if (pageNum > 1) {
                pageNum--;
                renderPage(pageNum);
                timeLeft = secondsPerSlide;
            }
        }

        // Boutons de contrôle
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTimer();
            } else {
                if (pageNum === totalPages && timeLeft <= 0) pageNum = 1;
                startTimer();
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            nextSlide();
            if (isPlaying) startTimer();
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            prevSlide();
            if (isPlaying) startTimer();
        });

        // Menu Paramètres escamotable
        const toggleSettingsBtn = document.getElementById('toggle-settings');
        const closeSettingsBtn = document.getElementById('close-settings');

        toggleSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('-translate-x-96');
            settingsPanel.classList.toggle('opacity-0');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('-translate-x-96');
            settingsPanel.classList.add('opacity-0');
        });

        document.getElementById('panel-seconds').addEventListener('change', (e) => {
            secondsPerSlide = parseInt(e.target.value) || 20;
            if (isPlaying) startTimer();
        });

        // Plein écran
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Quitter
        document.getElementById('btn-quit').addEventListener('click', () => {
            pauseTimer();
            presentationScreen.classList.add('hidden');
            uploadScreen.classList.remove('hidden');
            pdfFileInput.value = '';
        });

        // Raccourcis clavier (Espace = Pause/Play, Flèches = Diapos)
        document.addEventListener('keydown', (e) => {
            if (presentationScreen.classList.contains('hidden')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                playPauseBtn.click();
            } else if (e.code === 'ArrowRight') {
                document.getElementById('btn-next').click();
            } else if (e.code === 'ArrowLeft') {
                document.getElementById('btn-prev').click();
            }
        });
    </script>
</body>
</html>
